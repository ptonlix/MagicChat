name: Desktop PR

on:
  pull_request:
    paths:
      - "client-desktop/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-2025
          - name: macOS
            runner: macos-15
          - name: Linux
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: client-desktop/pnpm-lock.yaml
      - name: 安装固定依赖
        working-directory: client-desktop
        run: pnpm install --frozen-lockfile
      - name: 格式、静态、类型、单元和 IPC 契约测试
        working-directory: client-desktop
        run: pnpm check && pnpm test
      - name: 构建并校验本地 Renderer
        working-directory: client-desktop
        run: pnpm build && pnpm verify:build
