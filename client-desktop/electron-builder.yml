appId: com.magicchat.desktop
productName: 即应
artifactName: "Jiying-${version}-${os}-${arch}.${ext}"
asar: true
electronDownload:
  mirrorOptions:
    mirror: https://npmmirror.com/mirrors/electron/
afterPack: scripts/after-pack.mjs
directories:
  output: dist
  buildResources: resources
extraResources:
  - from: public/logo.png
    to: logo.png
  - from: public/trayTemplate.png
    to: trayTemplate.png
files:
  - out/**/*
  - package.json
extraMetadata:
  description: 即应 Desktop Stable OTA 构建
protocols:
  - name: 即应
    schemes:
      - magicchat
win:
  icon: public/logo.png
  target:
    - target: nsis
      arch: [x64, arm64]
  signAndEditExecutable: true
  verifyUpdateCodeSignature: false
nsis:
  shortcutName: 即应
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
mac:
  icon: public/logo.png
  hardenedRuntime: true
  notarize: true
  extendInfo:
    NSAppTransportSecurity:
      NSAllowsArbitraryLoads: false
      NSAllowsLocalNetworking: false
  target:
    - target: dmg
      arch: [universal]
  minimumSystemVersion: "13.0"
linux:
  icon: public/logo.png
  category: Network;Chat
  maintainer: "即应 <support@magicchat.com>"
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
  desktop:
    entry:
      StartupWMClass: 即应
      MimeType: x-scheme-handler/magicchat;
