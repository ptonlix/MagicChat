<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; navigate-to 'self'"
    />
    <title>MagicChat 恢复</title>
    <style>
      body {
        margin: 0;
        font: 14px system-ui;
        background: #fff;
        color: #18181b;
        display: grid;
        place-items: center;
        min-height: 100vh;
      }
      .titlebar {
        -webkit-app-region: drag;
        background: #f4f4f5;
        border-bottom: 1px solid #e4e4e7;
        height: 40px;
        left: 0;
        position: fixed;
        right: 0;
        top: 0;
      }
      .box {
        max-width: 420px;
        padding: 32px;
        border: 1px solid #e4e4e7;
        border-radius: 8px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 12px;
      }
      p {
        color: #52525b;
        line-height: 1.6;
      }
      a {
        -webkit-app-region: no-drag;
        display: inline-block;
        margin-top: 12px;
        color: #fff;
        background: #18181b;
        padding: 9px 14px;
        border-radius: 6px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div aria-hidden="true" class="titlebar"></div>
    <main class="box">
      <h1>界面进程已停止</h1>
      <p>服务器配置和登录会话仍保存在主进程中。重新加载只会恢复本地界面。</p>
      <a href="magicchat-app://app/index.html">重新加载</a>
    </main>
  </body>
</html>
